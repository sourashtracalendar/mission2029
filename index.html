<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sourashtra Calendar</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #fffbf0;
    text-align: center;
  }
  h1 {
    font-size: 32px;
    color: #b5451b;
    margin-bottom: 8px;
  }
  p {
    color: #666;
    margin-bottom: 30px;
  }
  .btn {
    display: inline-block;
    padding: 16px 50px;
    font-size: 22px;
    font-weight: 600;
    color: white;
    background: #d95a1e;
    border-radius: 50px;
    text-decoration: none;
    box-shadow: 0 4px 15px rgba(217, 90, 30, 0.3);
    transition: all 0.2s ease;
  }
  .btn:hover {
    background: #b5451b;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(217, 90, 30, 0.4);
  }
</style>
</head>
<body>

  <h1>🗓️ Sourashtra Calendar</h1>
  <p>Click below to view the calendar</p>

  <a class="btn" href="https://sourashtracalendar.github.io/2027/">2027 Calendar</a>

</body>
</html>
